name: Build, Push and Deploy (self-hosted deploy)

on:
  push:
    branches: [ Dev ]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  APP_BACKEND: transcendence-backend
  APP_FRONTEND: transcendence-frontend


jobs:
  build-and-push:
    runs-on: [self-hosted]
    outputs:
      image-tag: ${{ steps.set-tag.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set IMAGE TAG
        id: set-tag
        run: echo "::set-output name=sha::${GITHUB_SHA::8}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP_BACKEND }}:${{ steps.set-tag.outputs.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP_FRONTEND }}:${{ steps.set-tag.outputs.sha }}

  deploy:
    needs: build-and-push
    # this job must run on your self-hosted runner running on the VM
    runs-on: [ self-hosted, dev-runner ]
    environment: production
    steps:
      - name: Checkout (needed if you want compose file from repo)
        uses: actions/checkout@v4

      - name: Log in to GHCR on VM
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      - name: Ensure app dir exists and copy files
        run: |
          mkdir -p ~/app
          # copy nesseary files from repo
          mkdir -p ~/app/nginx
          cp ./nginx/nginx.conf ~/app/nginx/nginx.conf
          mkdir -p ~/app/nginx/ssl
          # copy the production compose file
          cp ./docker-compose.prod.yml ~/app/docker-compose.prod.yml
          # copy .env.production from secrets
          cat > ~/app/.env.production <<EOF
          # These variables are used in the docker-compose.prod.yml file
          IMAGE_BACKEND=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP_BACKEND }}:latest
          IMAGE_FRONTEND=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.APP_FRONTEND }}:latest
          EOF
          chmod 600 ~/app/.env.production
          ls -al ~/app

      - name: Pull & Deploy
        run: |
          cd ~/app
          docker compose --env-file .env.production -f docker-compose.prod.yml pull
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans