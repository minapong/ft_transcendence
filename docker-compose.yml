version: "3.8"

services:
  frontend:
    build:
      context: ./Frontend
    expose:
      - "80"
    networks:
      - web

  nginx:
    image: nginx:alpine
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certbot:/etc/letsencrypt
      - ./frontend/dist:/usr/share/nginx/html
    networks:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :;
      do certbot renew;
      sleep 12h & wait $${!};
      done"

networks:
  web:
    driver: bridge
