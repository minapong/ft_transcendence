events {}

http {
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # SPA: redirect all unknown routes to index.html
        location / {
            try_files $uri /index.html =404;
        }

        error_page 404 /404.html;
        location = /404.html {
        internal;
        }
    }
}
