services:
  backend:
    image: ${IMAGE_BACKEND:-transcendence-backend:local}
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./transcendence.db
      - JWT_SECRET=super-dev-secret-change-me1
    restart: always
    networks:
      - app_net
    env_file: 
      - ./Backend/.env

  nginx:
    image: ${IMAGE_FRONTEND:-transcendence-frontend:local}
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/letsencrypt
    depends_on:
      - backend
    ports:
      - "8080:8080"
      # - "443:443"
    networks:
      - app_net
    restart: always

networks:
  app_net:
    driver: bridge