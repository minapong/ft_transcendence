services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    restart: always

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    restart: always

  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/letsencrypt
    restart: always
