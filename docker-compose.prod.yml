services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    restart: always
    expose:
      - "3000"

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    restart: always

  nginx:
    image: nginx:alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/letsencrypt
    networks:
      - app_net
    restart: always
