services:
  backend:
    image: ${IMAGE_BACKEND:-transcendence-backend:local}
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    env_file:
      - ./Backend/.env
    restart: always
    networks:
      - app_net


  nginx:
    image: ${IMAGE_FRONTEND:-transcendence-frontend:local}
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    ports:
      - "8443:443"
    networks:
      - app_net
    restart: always

networks:
  app_net:
    driver: bridge